# Buduje podpisaną aplikację iOS i wysyła ją do TestFlight. Uruchamiany ręcznie (Actions → iOS TestFlight → Run workflow),
# bo minuty macOS w prywatnym repozytorium liczą się wielokrotnie.
#
# Wymagane sekrety repozytorium (Settings → Secrets and variables → Actions):
#   ASC_KEY_ID      – identyfikator klucza App Store Connect API
#   ASC_ISSUER_ID   – Issuer ID z tej samej strony
#   ASC_KEY_P8      – cała treść pliku AuthKey_XXXX.p8
#   APPLE_TEAM_ID   – Team ID z developer.apple.com → Membership
#   GOOGLE_SERVICE_INFO_PLIST (opcjonalny; bez niego build działa, ale bez powiadomień push) – plik GoogleService-Info.plist z Firebase (iOS, bundle ID pl.jestprzetarg.app) zakodowany base64
#                              (base64 -w0 GoogleService-Info.plist); w Firebase musi być wgrany klucz APNs (.p8)
# Klucz musi mieć rolę Admin albo App Manager (zarządzanie certyfikatami), a aplikacja o identyfikatorze
# pl.jestprzetarg.app musi już istnieć w App Store Connect.
name: iOS TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci

      - name: Set build number
        run: |
          node -e "
            const fs = require('fs');
            const c = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            c.expo.ios.buildNumber = process.env.GITHUB_RUN_NUMBER;
            fs.writeFileSync('app.json', JSON.stringify(c, null, 2));
          "

      - name: Write Firebase config (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > GoogleService-Info.plist
          else
            echo "::warning::Brak sekretu GOOGLE_SERVICE_INFO_PLIST — ten build nie będzie miał powiadomień push."
          fi

      - name: Generate native project
        run: npx expo prebuild --platform ios --clean

      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          [ -n "$WORKSPACE" ] || { echo "::error::Brak ios/*.xcworkspace — expo prebuild lub pod install nie powiodły się"; exit 1; }
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
